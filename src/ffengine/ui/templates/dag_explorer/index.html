<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAG Explorer</title>
  <link rel="stylesheet" href="/flow-studio/static/flow_studio/css/style.css?v=96">
  <style>
    /* DAG Explorer — restyled on the Flow Studio design system (self-sufficient
       tokens with Flow Studio fallbacks so it holds with or without the sheet). */
    :root {
      color-scheme: light dark;
      --bg: var(--color-bg-main, #f5f7fb);
      --card: var(--color-bg-1, #ffffff);
      --line: var(--color-border, #dbe2ea);
      --text: var(--color-text, #0f172a);
      --muted: var(--color-text-secondary, #64748b);
      --accent: var(--bs-primary, #0175ff);
      --accent-soft: rgba(1, 117, 255, 0.10);
      --ok: #16a34a;
      --ok-soft: #e8f7ee;
      --warn: #b45309;
      --warn-soft: #fdf3d6;
      --radius: 10px;
      --ctrl-radius: 6px;
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card: #111a2b;
      --line: #24344d;
      --text: #e6eefc;
      --muted: #9fb2cf;
      --accent: #4c9bff;
      --accent-soft: rgba(76, 155, 255, 0.16);
      --ok: #34d399;
      --ok-soft: #12351f;
      --warn: #fbbf24;
      --warn-soft: #3a2e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --card: #111a2b;
        --line: #24344d;
        --text: #e6eefc;
        --muted: #9fb2cf;
        --accent: #4c9bff;
        --accent-soft: rgba(76, 155, 255, 0.16);
        --ok: #34d399;
        --ok-soft: #12351f;
        --warn: #fbbf24;
        --warn-soft: #3a2e0b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-family-base, "Segoe UI", Arial, sans-serif);
      color: var(--text);
      background: var(--bg);
    }
    .page { max-width: 1340px; margin: 0 auto; padding: 20px; }
    .app-header { margin-bottom: 16px; }
    .app-header h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .app-header p { margin: 0; color: var(--muted); font-size: 14px; }
    .root-info { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .root-info code { font-family: var(--font-family-mono, Consolas, "Courier New", monospace); }

    /* Search bar */
    .searchbar {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--ctrl-radius); padding: 0 12px; height: 44px;
      margin: 14px 0 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: border-color .12s, box-shadow .12s;
    }
    .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .searchbar-icon { color: var(--muted); font-size: 18px; line-height: 1; }
    .searchbar-input {
      flex: 1; border: 0; background: transparent; color: var(--text);
      font-size: 14px; outline: none; height: 100%; min-width: 0;
    }
    .searchbar-input::placeholder { color: var(--muted); }
    .searchbar-clear {
      border: 0; background: transparent; color: var(--muted);
      font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    .searchbar-clear:hover { color: var(--text); }

    .layout {
      display: grid; grid-template-columns: 320px 1fr; gap: 16px; min-height: 560px;
    }
    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px; padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .panel h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .folder-actions { display: flex; gap: 6px; }
    .folder-btn {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: var(--ctrl-radius); padding: 5px 10px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all .12s;
    }
    .folder-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    /* Folder tree */
    .tree-list { list-style: none; margin: 0; padding: 0 0 0 14px; }
    .tree-list.root { padding-left: 0; }
    .tree-item { margin: 1px 0; }
    .tree-row { display: flex; align-items: center; gap: 4px; }
    .tree-toggle {
      width: 20px; height: 24px; border: 0; background: transparent;
      color: var(--muted); border-radius: 5px; cursor: pointer;
      line-height: 1; padding: 0; font-size: 11px; flex: none;
    }
    .tree-toggle:hover { background: var(--accent-soft); color: var(--accent); }
    .tree-toggle.placeholder { cursor: default; pointer-events: none; }
    .tree-btn {
      display: inline-block; border: 1px solid transparent; background: transparent;
      color: var(--text); font-size: 13px; text-align: left; border-radius: 6px;
      padding: 5px 8px; cursor: pointer; width: 100%;
    }
    .tree-btn:hover { background: var(--accent-soft); }
    .tree-btn.active {
      background: var(--accent-soft); border-color: var(--accent);
      color: var(--accent); font-weight: 600;
    }

    .status { margin: 8px 0; color: var(--muted); font-size: 13px; }
    .status.error { color: #dc2626; }

    /* DAG table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 8px; vertical-align: top; text-align: left; }
    th { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
    tbody tr:hover { background: var(--accent-soft); }
    .dag-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .dag-link:hover { text-decoration: underline; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
    .badge.on { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
    .badge.off { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
    .empty { color: var(--muted); padding: 16px 4px; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="app-header">
      <h1>DAG Explorer</h1>
      <p>Browse DAGs by folder hierarchy, or search inside DAG content. Select a DAG to open its Airflow page.</p>
      <div id="root_info" class="root-info">Root: -</div>
    </div>

    <div class="searchbar">
      <span class="searchbar-icon" aria-hidden="true">&#9906;</span>
      <input id="dag_search" type="text" class="searchbar-input" autocomplete="off"
             placeholder="Search inside DAG content &mdash; config/yaml included (case-insensitive)&hellip;">
      <button id="dag_search_clear" class="searchbar-clear" type="button" title="Clear" style="display:none">&times;</button>
    </div>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Folders</h2>
          <div class="folder-actions">
            <button id="expand_all_btn" class="folder-btn" type="button">Expand All</button>
            <button id="collapse_all_btn" class="folder-btn" type="button">Collapse All</button>
          </div>
        </div>
        <div id="tree_status" class="status">Loading...</div>
        <div id="tree_container"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="list_title">DAGs</h2>
          <span id="list_status" class="status" style="margin:0"></span>
        </div>
        <div id="list_container"></div>
      </section>
    </div>
  </div>

  <script>
    (() => {
      const treeStatus = document.getElementById("tree_status");
      const treeContainer = document.getElementById("tree_container");
      const listContainer = document.getElementById("list_container");
      const listStatus = document.getElementById("list_status");
      const listTitle = document.getElementById("list_title");
      const rootInfo = document.getElementById("root_info");
      const expandAllBtn = document.getElementById("expand_all_btn");
      const collapseAllBtn = document.getElementById("collapse_all_btn");
      const dagSearch = document.getElementById("dag_search");
      const dagSearchClear = document.getElementById("dag_search_clear");

      let currentSelection = { bucket: "dags_root", key: "" };
      let dagItems = [];
      let treeMap = new Map();
      let collapsedKeys = new Set();
      let searchMode = false;
      let searchTimer = null;

      function resolveTheme() {
        let explicit = "";
        try {
          explicit = String(localStorage.getItem("chakra-ui-color-mode") || "").trim().toLowerCase();
        } catch (error) {
          explicit = "";
        }
        if (explicit === "light" || explicit === "dark") {
          return explicit;
        }
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }
        return "light";
      }

      function applyTheme() {
        document.documentElement.setAttribute("data-theme", resolveTheme());
      }

      function basePath() {
        return "/flow-studio";
      }

      function normalizeFolderKey(parts) {
        return (parts || []).join("/");
      }

      function fmtDate(value) {
        const text = String(value || "").trim();
        if (!text) return "-";
        const d = new Date(text);
        if (!Number.isNaN(d.getTime())) {
          return d.toLocaleString();
        }
        return text;
      }

      function expandAncestors(key) {
        if (!key) return;
        const parts = key.split("/");
        const prefixes = [];
        for (let i = 0; i < parts.length; i += 1) {
          prefixes.push(parts.slice(0, i + 1).join("/"));
        }
        for (const prefix of prefixes) {
          collapsedKeys.delete(prefix);
        }
      }

      function clearSearchSilently() {
        if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
        searchMode = false;
        if (dagSearch) dagSearch.value = "";
        if (dagSearchClear) dagSearchClear.style.display = "none";
        if (listStatus) listStatus.classList.remove("error");
      }

      function selectNode(bucket, key) {
        clearSearchSilently();
        if (bucket === "dags_root") {
          expandAncestors(key || "");
        }
        currentSelection = { bucket, key: key || "" };
        renderTree();
        renderList();
      }

      function treeChildrenFor(parentKey) {
        const out = new Set();
        for (const key of treeMap.keys()) {
          if (!parentKey) {
            if (!key) continue;
            const first = key.split("/")[0];
            if (first) out.add(first);
            continue;
          }
          if (!key.startsWith(parentKey + "/")) continue;
          const rest = key.slice(parentKey.length + 1);
          if (!rest) continue;
          const next = rest.split("/")[0];
          const full = parentKey + "/" + next;
          out.add(full);
        }
        return Array.from(out).sort((a, b) => a.localeCompare(b));
      }

      function toggleNode(fullKey) {
        if (collapsedKeys.has(fullKey)) {
          collapsedKeys.delete(fullKey);
        } else {
          collapsedKeys.add(fullKey);
        }
        renderTree();
      }

      function collapseAllFolders() {
        collapsedKeys = new Set(Array.from(treeMap.keys()));
        renderTree();
      }

      function expandAllFolders() {
        collapsedKeys.clear();
        renderTree();
      }

      function renderTreeNode(parentUl, fullKey) {
        const label = fullKey.split("/").slice(-1)[0] || "/";
        const li = document.createElement("li");
        li.className = "tree-item";
        const row = document.createElement("div");
        row.className = "tree-row";
        const children = treeChildrenFor(fullKey);
        const hasChildren = children.length > 0;

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tree-toggle";
        if (!hasChildren) {
          toggle.classList.add("placeholder");
          toggle.textContent = " ";
        } else {
          const isCollapsed = collapsedKeys.has(fullKey);
          toggle.textContent = isCollapsed ? "▸" : "▾";
          toggle.onclick = (event) => {
            event.stopPropagation();
            toggleNode(fullKey);
          };
        }
        row.appendChild(toggle);

        const btn = document.createElement("button");
        btn.className = "tree-btn";
        if (currentSelection.bucket === "dags_root" && currentSelection.key === fullKey) {
          btn.classList.add("active");
        }
        btn.textContent = label;
        btn.type = "button";
        btn.onclick = () => selectNode("dags_root", fullKey);
        row.appendChild(btn);
        li.appendChild(row);

        if (hasChildren && !collapsedKeys.has(fullKey)) {
          const ul = document.createElement("ul");
          ul.className = "tree-list";
          for (const child of children) {
            renderTreeNode(ul, child);
          }
          li.appendChild(ul);
        }
        parentUl.appendChild(li);
      }

      function renderTree() {
        treeContainer.innerHTML = "";
        const rootUl = document.createElement("ul");
        rootUl.className = "tree-list root";

        const rootLi = document.createElement("li");
        rootLi.className = "tree-item";
        const rootBtn = document.createElement("button");
        rootBtn.className = "tree-btn";
        if (currentSelection.bucket === "dags_root" && currentSelection.key === "") {
          rootBtn.classList.add("active");
        }
        rootBtn.type = "button";
        rootBtn.textContent = "/ (dags root)";
        rootBtn.onclick = () => selectNode("dags_root", "");
        rootLi.appendChild(rootBtn);
        rootUl.appendChild(rootLi);

        for (const child of treeChildrenFor("")) {
          renderTreeNode(rootUl, child);
        }

        const externalLi = document.createElement("li");
        externalLi.className = "tree-item";
        const externalBtn = document.createElement("button");
        externalBtn.className = "tree-btn";
        if (currentSelection.bucket === "external") {
          externalBtn.classList.add("active");
        }
        externalBtn.type = "button";
        externalBtn.textContent = "external";
        externalBtn.onclick = () => selectNode("external", "");
        externalLi.appendChild(externalBtn);
        rootUl.appendChild(externalLi);

        treeContainer.appendChild(rootUl);
      }

      function filteredItems() {
        if (currentSelection.bucket === "external") {
          return dagItems.filter((x) => x.bucket === "external");
        }
        return dagItems.filter((x) => {
          if (x.bucket !== "dags_root") return false;
          return normalizeFolderKey(x.folder_parts) === currentSelection.key;
        });
      }

      // Shared right-panel renderer — reused by folder view and search results,
      // so the DAG link + status badge behave identically in both.
      function renderDagTable(items, titleText, statusText) {
        listStatus.classList.remove("error");
        listTitle.textContent = titleText;
        listStatus.textContent = statusText;
        listContainer.innerHTML = "";

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = searchMode ? "No DAG matched your search." : "No DAG in this folder.";
          listContainer.appendChild(empty);
          return;
        }

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = "<tr><th>DAG</th><th>Status</th><th>Latest Run</th><th>Creation Date</th></tr>";
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        for (const item of items) {
          const tr = document.createElement("tr");

          const tdDag = document.createElement("td");
          const link = document.createElement("a");
          link.className = "dag-link";
          link.href = item.dag_url;
          link.onclick = (event) => {
            event.preventDefault();
            const url = String(item.dag_url || "");
            if (!url) return;
            try {
              if (window.top && window.top !== window) {
                window.top.location.assign(url);
                return;
              }
            } catch (error) {
              // sandbox or cross-window restrictions: fallback to same frame
            }
            window.location.assign(url);
          };
          link.textContent = item.dag_id;
          tdDag.appendChild(link);

          const tdStatus = document.createElement("td");
          const status = document.createElement("span");
          status.className = "badge " + (item.is_paused ? "on" : "off");
          status.textContent = item.is_paused ? "paused" : "active";
          tdStatus.appendChild(status);

          const tdLatestRun = document.createElement("td");
          tdLatestRun.textContent = fmtDate(item.latest_run);
          tdLatestRun.title = String(item.latest_run || "");

          const tdCreateDate = document.createElement("td");
          tdCreateDate.textContent = fmtDate(item.create_date);
          tdCreateDate.title = String(item.create_date || "");

          tr.appendChild(tdDag);
          tr.appendChild(tdStatus);
          tr.appendChild(tdLatestRun);
          tr.appendChild(tdCreateDate);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        listContainer.appendChild(table);
      }

      function renderList() {
        const items = filteredItems();
        const title = currentSelection.bucket === "external"
          ? "DAGs / external"
          : "DAGs / " + (currentSelection.key || "/");
        renderDagTable(items, title, items.length + " DAG(s)");
      }

      async function runSearch(query) {
        searchMode = true;
        listStatus.classList.remove("error");
        listTitle.textContent = 'Search: "' + query + '"';
        listStatus.textContent = "Searching…";
        listContainer.innerHTML = "";
        try {
          const response = await fetch(
            basePath() + "/api/dag-search?q=" + encodeURIComponent(query),
            { headers: { "Accept": "application/json" }, credentials: "same-origin" }
          );
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.detail || "Search failed.");
          }
          // Ignore stale responses (user kept typing).
          if (String(dagSearch.value || "").trim() !== query) return;
          const items = Array.isArray(data.items) ? data.items : [];
          renderDagTable(
            items,
            'Search: "' + query + '"',
            items.length + " result(s)"
          );
        } catch (error) {
          listStatus.textContent = String((error && error.message) || error);
          listStatus.classList.add("error");
          listContainer.innerHTML = "";
        }
      }

      function onSearchInput() {
        const raw = String(dagSearch.value || "");
        dagSearchClear.style.display = raw ? "" : "none";
        if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
        const query = raw.trim();
        if (!query) {
          searchMode = false;
          renderList();
          return;
        }
        searchTimer = setTimeout(() => runSearch(query), 250);
      }

      async function loadData() {
        treeStatus.textContent = "Loading...";
        treeStatus.classList.remove("error");
        try {
          const response = await fetch(basePath() + "/api/dag-explorer", {
            headers: { "Accept": "application/json" },
            credentials: "same-origin",
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.detail || "Failed to load DAG explorer data.");
          }
          dagItems = Array.isArray(data.items) ? data.items : [];
          treeMap = new Map();
          const folderKeySet = new Set();
          for (const item of dagItems) {
            if (item.bucket !== "dags_root") continue;
            const parts = Array.isArray(item.folder_parts) ? item.folder_parts : [];
            for (let i = 0; i < parts.length; i += 1) {
              const key = normalizeFolderKey(parts.slice(0, i + 1));
              if (key) folderKeySet.add(key);
            }
          }
          for (const key of Array.from(folderKeySet).sort((a, b) => a.localeCompare(b))) {
            treeMap.set(key, true);
          }
          // Collapsed by default: seed every folder key as collapsed (root stays
          // visible; child folders start closed). Expand/Collapse All still work.
          collapsedKeys = new Set(Array.from(treeMap.keys()));
          rootInfo.textContent = "";
          rootInfo.appendChild(document.createTextNode("Root: "));
          const rootCode = document.createElement("code");
          rootCode.textContent = String(data.root || "-");
          rootInfo.appendChild(rootCode);
          treeStatus.textContent = "Ready";
          renderTree();
          renderList();
        } catch (error) {
          treeStatus.textContent = String((error && error.message) || error);
          treeStatus.classList.add("error");
          listContainer.innerHTML = "";
          listStatus.textContent = "";
        }
      }

      expandAllBtn.onclick = expandAllFolders;
      collapseAllBtn.onclick = collapseAllFolders;
      dagSearch.addEventListener("input", onSearchInput);
      dagSearchClear.onclick = () => {
        dagSearch.value = "";
        onSearchInput();
        dagSearch.focus();
      };
      applyTheme();
      try {
        const darkMedia = window.matchMedia("(prefers-color-scheme: dark)");
        darkMedia.addEventListener("change", applyTheme);
      } catch (error) {
        // ignore matchMedia listener issues on older browsers
      }
      window.addEventListener("storage", applyTheme);
      loadData();
    })();
  </script>
</body>
</html>
