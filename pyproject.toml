[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffengine"
version = "0.1.5"
description = "Fast Flow Engine Community: Query-centric Airflow Native Data Integrator"
authors = [
    {name = "FFEngine Team", email = "contact@ffengine.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.2.2,<3.3",
    "apache-airflow-providers-fab>=3.6.2,<3.7",
    "apache-airflow-providers-microsoft-mssql>=4.0.0",
    "apache-airflow-providers-oracle>=4.0.0",
    "apache-airflow-providers-smtp>=2.0.0",
    "apache-airflow-providers-sftp>=4.0.0",
    "apache-airflow-providers-standard>=1.6.0",
    "flask-appbuilder>=4.3.0",
    "psycopg[binary]>=3.1.0",
    "pyodbc>=5.0.0",
    "oracledb>=2.0.0",
    "fastapi>=0.116.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
    "httpx>=0.27.0",
    "debugpy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffengine = [
    "ui/templates/flow_studio/*.html",
    "ui/templates/dag_explorer/*.html",
    "ui/static/flow_studio/css/*.css",
    "ui/static/flow_studio/js/*.js",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
markers = [
    "integration: container-backed integration tests",
]
